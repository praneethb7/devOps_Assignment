apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notes-chart.fullname" . }}
  labels:
    {{- include "notes-chart.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  index.html: |
    <!doctype html>
    <html><body>
      <h1>{{ .Values.config.banner }}</h1>
      <p>release: {{ .Release.Name }}</p>
      <p>chart: {{ .Chart.Name }}-{{ .Chart.Version }}</p>
      <p>appVersion: {{ .Chart.AppVersion }}</p>
      <p>revision: {{ .Release.Revision }}</p>
      <p>environment: {{ .Values.config.environment }}</p>
    </body></html>
