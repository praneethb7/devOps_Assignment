# Two helper Pods, created once and reused for every check below.
# `client` does HTTP, `dns` does name resolution.
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: dns
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "86400"]
