# Recreate: every v1 Pod is terminated before the first v2 Pod starts.
# Guarantees no two versions run at once, at the cost of real downtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-recreate
spec:
  replicas: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app-recreate
  template:
    metadata:
      labels:
        app: app-recreate
        track: v2
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          command: ["/bin/sh","-c","echo 'VERSION: v2 (UPGRADED)' > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
