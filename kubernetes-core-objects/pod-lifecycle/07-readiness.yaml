# Readiness probe: Running != Ready. The container is up immediately, but the
# probe only passes after the file appears at 20s, so READY stays 0/1 and the
# Pod is kept out of Service endpoints until then.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-readiness
  labels:
    app: lifecycle-readiness
spec:
  containers:
    - name: slow-ready
      image: busybox:1.36
      command: ["sh", "-c", "sleep 20; touch /tmp/ready; sleep 3600"]
      readinessProbe:
        exec:
          command: ["cat", "/tmp/ready"]
        initialDelaySeconds: 3
        periodSeconds: 3
