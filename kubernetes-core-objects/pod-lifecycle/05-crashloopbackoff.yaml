# Not a phase but a container state: the container keeps exiting non-zero
# under the default restartPolicy: Always, so the kubelet restarts it with
# exponential backoff (10s, 20s, 40s ... capped at 5m).
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-crashloop
spec:
  containers:
    - name: crasher
      image: busybox:1.36
      command: ["sh", "-c", "echo 'starting up'; sleep 3; echo 'crashing'; exit 1"]
