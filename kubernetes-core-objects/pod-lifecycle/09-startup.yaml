# Startup probe: protects a slow-booting app. While it is still failing, the
# liveness probe is suspended -- without it, an aggressive liveness probe
# would kill the container before it ever finished starting.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-startup
spec:
  containers:
    - name: slow-starter
      image: busybox:1.36
      command: ["sh", "-c", "sleep 25; touch /tmp/started; sleep 3600"]
      startupProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 5
        failureThreshold: 12   # allows up to 60s to start
      livenessProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 3
        failureThreshold: 1    # brutal on its own; safe behind the startup probe
