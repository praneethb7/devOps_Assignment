# Phase: Failed -- exits non-zero with restartPolicy: Never. Terminal state,
# no restart, and the exit code is preserved for inspection.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-failed
spec:
  restartPolicy: Never
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "echo 'fatal error'; exit 1"]
