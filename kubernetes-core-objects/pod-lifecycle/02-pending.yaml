# Phase: Pending -- the API object exists in etcd, but the scheduler cannot
# place it. Here the memory request is larger than any node can satisfy,
# so it sits unschedulable forever with a FailedScheduling event.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-pending
spec:
  containers:
    - name: greedy
      image: nginx:1.27-alpine
      resources:
        requests:
          memory: "500Gi"
          cpu: "100"
