# A batch-style Pod: runs once, exits 0, and is never restarted.
# restartPolicy: Never is what lets the Pod reach Succeeded/Completed
# instead of looping forever.
apiVersion: v1
kind: Pod
metadata:
  name: hello-pod
spec:
  restartPolicy: Never
  containers:
    - name: hello
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Hello from a short-lived Pod'; sleep 5; echo done"]
