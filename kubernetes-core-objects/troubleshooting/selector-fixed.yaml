# Drill 2 (fixed): template labels now match the selector, so it applies.
# spec.selector.matchLabels says `app: selector-demo` but the Pod template
# labels say `app: selector-demo-typo`. A Deployment whose selector cannot
# match its own Pods is invalid, so the API server refuses it outright.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-error-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: selector-demo
  template:
    metadata:
      labels:
        app: selector-demo               # <-- now matches
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests: {cpu: "10m", memory: "16Mi"}
