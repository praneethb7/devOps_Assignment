# The cutover is this one line: selector.slot. Traffic follows the selector,
# so flipping blue -> green moves 100% of requests in the time it takes
# kube-proxy to rewrite its rules. No mixed-version window.
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  type: NodePort
  selector:
    app: myapp
    slot: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30020
