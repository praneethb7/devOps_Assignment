# The scale target. resources.requests.cpu is mandatory for HPA:
# utilisation is measured as a percentage OF THE REQUEST.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-search
  labels:
    app: yatri-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yatri-search
  template:
    metadata:
      labels:
        app: yatri-search
    spec:
      containers:
        - name: search
          image: registry.k8s.io/hpa-example
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-search
spec:
  selector:
    app: yatri-search
  ports:
    - port: 80
      targetPort: 80
