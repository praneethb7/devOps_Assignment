# Hammers the Service from inside the cluster. Each Pod runs 8 request
# loops in parallel: a single serial `wget` loop is bounded by process
# startup, not by the server, and barely moves the target's CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-load
  labels:
    app: yatri-load
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-load
  template:
    metadata:
      labels:
        app: yatri-load
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while [ $i -lt 8 ]; do
                ( while true; do wget -q -O- http://yatri-search >/dev/null 2>&1; done ) &
                i=$((i+1))
              done
              wait
          resources:
            requests:
              cpu: 50m
