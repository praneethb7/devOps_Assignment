apiVersion: v1
kind: Pod
metadata:
  name: yatri-pvc-writer
  labels:
    app: yatri-storage
    demo: pvc
spec:
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: yatri-static-pvc
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo 'receipt-1001 persisted' >> /data/receipts.log && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
