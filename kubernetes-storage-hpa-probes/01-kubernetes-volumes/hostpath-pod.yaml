# hostPath: mounts a path from the NODE's filesystem into the Pod.
# Tied to one node, which is why it does not belong in a multi-node deployment.
apiVersion: v1
kind: Pod
metadata:
  name: yatri-hostpath
  labels:
    app: yatri-storage
    demo: hostpath
spec:
  volumes:
    - name: node-disk
      hostPath:
        path: /mnt/yatri-hostpath
        type: DirectoryOrCreate
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo 'written to the node disk' > /node/proof.txt && sleep 3600"]
      volumeMounts:
        - name: node-disk
          mountPath: /node
