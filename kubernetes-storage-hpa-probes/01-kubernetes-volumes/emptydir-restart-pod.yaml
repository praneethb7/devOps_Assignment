# Same emptyDir, but the writer exits non-zero on purpose every 10s.
# restartPolicy defaults to Always, so the kubelet restarts the CONTAINER
# while the Pod - and therefore the volume - stays put.
# The reader sidecar just stays alive so the volume is always readable.
apiVersion: v1
kind: Pod
metadata:
  name: yatri-emptydir-restart
  labels:
    app: yatri-storage
    demo: emptydir-restart
spec:
  volumes:
    - name: scratch
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "$(date -Iseconds) writer started" >> /shared/bookings.log
          sleep 10
          exit 1
      volumeMounts:
        - name: scratch
          mountPath: /shared
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: scratch
          mountPath: /shared
          readOnly: true
