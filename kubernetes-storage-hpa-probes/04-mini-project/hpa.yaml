apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: receipts-api
  namespace: yatri-receipts
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: receipts-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
