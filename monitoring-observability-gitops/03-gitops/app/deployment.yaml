# This file is the desired state. Argo CD reconciles the cluster to match it.
# Nothing here is ever applied by hand - a git commit is the deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-web
  namespace: yatri-gitops
  labels: { app: yatri-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: yatri-web }
  template:
    metadata:
      labels: { app: yatri-web }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
