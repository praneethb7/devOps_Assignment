# A workload used to show the three observability signals on Kubernetes:
# metrics (kubectl top), logs (kubectl logs), and traces - which Kubernetes
# itself does not provide, which is the point of the exercise.
apiVersion: v1
kind: Namespace
metadata:
  name: observability-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-signals
  namespace: observability-demo
spec:
  replicas: 2
  selector:
    matchLabels: { app: yatri-signals }
  template:
    metadata:
      labels: { app: yatri-signals }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                if [ $((i % 7)) -eq 0 ]; then
                  echo "{\"level\":\"error\",\"event\":\"booking_failed\",\"seq\":$i,\"reason\":\"payment_declined\"}"
                else
                  echo "{\"level\":\"info\",\"event\":\"booking_confirmed\",\"seq\":$i}"
                fi
                sleep 2
              done
          resources:
            requests: { cpu: 25m, memory: 16Mi }
