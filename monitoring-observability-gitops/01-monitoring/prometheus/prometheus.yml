global:
  scrape_interval: 5s          # fast, so a demo shows movement quickly
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus scraping itself - always worth having, it is how you know
  # Prometheus is alive when everything else looks dead.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: yatri-bookings
    static_configs:
      - targets: ['metrics-app:8000']
        labels:
          service: bookings
          environment: dev
