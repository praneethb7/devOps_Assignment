# BROKEN: mounts a Secret that does not exist. The kubelet cannot build
# the container's filesystem, so it sits in ContainerCreating.
apiVersion: v1
kind: Pod
metadata:
  name: yatri-stuck-creating
  labels: { app: yatri-stuck-creating }
spec:
  volumes:
    - name: creds
      secret:
        secretName: yatri-db-credentials-missing
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
