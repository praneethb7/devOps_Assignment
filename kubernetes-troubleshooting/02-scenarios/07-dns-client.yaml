# A plain client Pod with DNS tools, used to resolve Service names
# and to show what a wrong name looks like.
apiVersion: v1
kind: Pod
metadata:
  name: yatri-dns-client
  labels: { app: yatri-dns-client }
spec:
  containers:
    - name: tools
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
