# BROKEN: targetPort 8080 but the container listens on 80.
# Endpoints are populated, the Service looks healthy, connections still fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-ports
spec:
  replicas: 1
  selector:
    matchLabels: { app: yatri-ports }
  template:
    metadata:
      labels: { app: yatri-ports }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-ports
spec:
  selector: { app: yatri-ports }
  ports:
    - port: 80
      targetPort: 8080
