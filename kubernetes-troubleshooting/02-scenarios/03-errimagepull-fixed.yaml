# FIXED: reference an image the node can actually pull.
# For a genuinely private repo the real fix is an imagePullSecret:
#   kubectl create secret docker-registry ghcr-creds \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<token>
# and then imagePullSecrets below.
apiVersion: v1
kind: Pod
metadata:
  name: yatri-private
  labels: { app: yatri-private }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
