# A healthy two-replica Deployment used as the subject for the
# diagnostic command tour: get, describe, logs, exec, events, explain, top.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-probe-target
  labels: { app: yatri-probe-target }
spec:
  replicas: 2
  selector:
    matchLabels: { app: yatri-probe-target }
  template:
    metadata:
      labels: { app: yatri-probe-target }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-probe-target
spec:
  selector: { app: yatri-probe-target }
  ports:
    - port: 80
      targetPort: 80
