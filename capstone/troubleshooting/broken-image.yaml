apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image
  namespace: campuscrate
spec:
  replicas: 1
  selector:
    matchLabels: {app: broken-image}
  template:
    metadata:
      labels: {app: broken-image}
    spec:
      containers:
        - name: frontend
          image: nginxinc/nginx-unprivileged:campuscrate-missing-tag
