# Session 16 - CI/CD with GitHub Actions
#
# CI  (continuous integration): lint -> test on a matrix -> build the image
# CD  (continuous delivery):    publish the image, then prove the published
#                               artifact actually runs
#
# The workflow file lives at the repository root because GitHub only reads
# workflows from .github/workflows/. The `paths` filter is what keeps it
# scoped to one folder's source.
name: yatri-fares CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'cicd-github-actions/**'
      - '.github/workflows/yatri-fares-cicd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cicd-github-actions/**'
  workflow_dispatch:          # manual trigger, from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/yatri-fares

defaults:
  run:
    working-directory: cicd-github-actions

jobs:
  # ---------------------------------------------------------------- CI ----
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Check style
        run: ruff check app tests

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one version failing still reports the others
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest --junitxml=results-${{ matrix.python-version }}.xml \
                 --cov=app --cov-report=term --cov-report=xml

      # Artifacts: files that outlive the runner, downloadable from the run page.
      - name: Upload test results
        if: always()          # upload even when the tests failed - that is the interesting case
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            cicd-github-actions/results-*.xml
            cicd-github-actions/coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------- CD ----
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: [lint, test]       # gate: nothing publishes until CI is green
    if: github.event_name != 'pull_request'

    # GITHUB_TOKEN is injected automatically; it needs an explicit
    # packages: write to push to the registry.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./cicd-github-actions
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record what was published
        run: |
          echo "### Published image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  smoke:
    name: Smoke test the published image
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
    steps:
      # Needed only so the workflow-level working-directory exists on this
      # runner - this job builds nothing from source.
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the image that was just published - not a locally built one.
      # This is the step that proves the artifact works, not just the source.
      - name: Run the published image
        run: |
          # GHCR rejects uppercase in an image name. docker/metadata-action
          # lowercases it automatically on push; a hand-built ref has to do
          # the same, because this repository is "devOps_Assignment".
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          echo "pulling $IMAGE"
          docker run -d --name yatri -p 8000:8000 "$IMAGE"
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: Assert the endpoints answer correctly
        run: |
          curl -sf http://localhost:8000/health | tee /tmp/health.json
          echo
          curl -sf 'http://localhost:8000/fare?km=100&passengers=2&class=premium' | tee /tmp/fare.json
          echo
          grep -q '"status": "ok"' /tmp/health.json
          grep -q '"total": 880.0' /tmp/fare.json

      - name: Container logs on failure
        if: failure()
        run: docker logs yatri
