name: CampusCrate delivery
on:
  push:
    branches: [main]
    paths: ['capstone/**', '.github/workflows/campuscrate.yml']
  pull_request:
    paths: ['capstone/**', '.github/workflows/campuscrate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: campuscrate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: campuscrate
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: campuscrate_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campuscrate -d campuscrate_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: capstone/backend/requirements*.txt}
      - run: pip install -r requirements-dev.txt
        working-directory: capstone/backend
      - name: Lint and test against isolated PostgreSQL
        working-directory: capstone/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://campuscrate:test-only-password@localhost:5432/campuscrate_test
        run: |
          ruff check .
          pytest -v --cov=app --cov-fail-under=90 --junitxml=results.xml
      - name: Validate migration upgrade and downgrade
        working-directory: capstone/backend
        env:
          DATABASE_URL: postgresql+psycopg://campuscrate:test-only-password@localhost:5432/campuscrate_test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: capstone/frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: capstone/frontend
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint capstone/helm/campuscrate -f capstone/helm/campuscrate/values-local.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: Validate infrastructure without AWS access
        run: |
          terraform -chdir=capstone/terraform fmt -check
          terraform -chdir=capstone/terraform init -backend=false
          terraform -chdir=capstone/terraform validate
          terraform -chdir=capstone/terraform test
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: capstone/backend/results.xml}
  build-scan-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: capstone/${{ matrix.component }}
          load: true
          tags: ghcr.io/praneethb7/campuscrate-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Trivy HIGH and CRITICAL gate
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/praneethb7/campuscrate-${{ matrix.component }}:${{ github.sha }}
          format: table
          output: trivy-${{ matrix.component }}.txt
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Print security report
        if: always()
        run: cat trivy-${{ matrix.component }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.txt
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested and scanned image
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/praneethb7/campuscrate-${{ matrix.component }}:${{ github.sha }}
      - name: Export candidate for Kubernetes deployment
        run: docker save ghcr.io/praneethb7/campuscrate-${{ matrix.component }}:${{ github.sha }} -o /tmp/${{ matrix.component }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.component }}
          path: /tmp/${{ matrix.component }}.tar
          retention-days: 1
  deploy-smoke:
    needs: build-scan-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: image-*, path: /tmp/images, merge-multiple: true}
      - uses: helm/kind-action@v1.12.0
        with: {cluster_name: campuscrate}
      - uses: azure/setup-helm@v4.3.1
      - name: Load the exact scanned images
        run: |
          kind load image-archive /tmp/images/backend.tar --name campuscrate
          kind load image-archive /tmp/images/frontend.tar --name campuscrate
      - name: Deploy with Helm
        run: |
          kubectl apply -f capstone/k8s/namespace.yaml
          password=$(openssl rand -hex 24)
          kubectl -n campuscrate create secret generic campuscrate-db             --from-literal=POSTGRES_PASSWORD="$password"             --from-literal=DATABASE_URL="postgresql+psycopg://campuscrate:$password@postgres:5432/campuscrate"
          helm upgrade --install campuscrate capstone/helm/campuscrate -n campuscrate             --set backend.tag=${{ github.sha }} --set frontend.tag=${{ github.sha }}             --set autoscaling.enabled=false --set ingress.enabled=false             --wait --wait-for-jobs --timeout 5m
      - name: Exercise deployed inventory and loan lifecycle
        run: |
          kubectl -n campuscrate port-forward svc/frontend 3000:8080 > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/health && break || sleep 2; done
          python capstone/scripts/smoke.py http://localhost:3000
          kubectl -n campuscrate get pods,svc,hpa
          helm list -n campuscrate
      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl -n campuscrate get pods,jobs,events
          kubectl -n campuscrate logs -l app=campuscrate-backend --all-containers --tail=100
      - name: Remove test cluster
        if: always()
        run: kind delete cluster --name campuscrate
