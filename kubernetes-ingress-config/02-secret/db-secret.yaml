# type: Opaque is the generic key/value Secret.
#
# The values are base64 **encoded**, not encrypted -- anyone who can read this
# object can decode them in one command. Base64 is here so the field can carry
# arbitrary bytes, not to provide secrecy. See Task 5 for how this is handled
# properly in production.
#
# Generated with:  printf 'yatri_admin'    | base64
#                  printf 'secretpassword' | base64
# printf, not echo -- see Task 4 for why that matters.
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
type: Opaque
data:
  POSTGRES_USER: eWF0cmlfYWRtaW4=
  POSTGRES_PASSWORD: c2VjcmV0cGFzc3dvcmQ=
